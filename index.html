<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Competitive Examination Study Execution & Daily Command Center — Your personal study manager that tells you exactly what to study right now.">
  <title>CSS Command Center — Study Execution System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    /* Critical inline styles for initial load */
    #app-loader {
      position: fixed; inset: 0;
      background: #0a0e1a;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #app-loader.fade-out { opacity: 0; pointer-events: none; }
    .loader-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-text {
      color: #94a3b8; font-family: 'Inter', sans-serif;
      font-size: 0.875rem; font-weight: 500;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="app-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Initializing Command Center…</div>
  </div>

  <!-- Main Application -->
  <div id="app">
    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar__logo">
        <span style="font-size: 1.5rem;">⚡</span>
        <span>CSS Command Center</span>
      </div>

      <div class="sidebar__nav" id="sidebar-nav">
        <a class="sidebar__nav-item sidebar__nav-item--active" data-route="home" href="#home">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Command Center</span>
        </a>
        <a class="sidebar__nav-item" data-route="today" href="#today">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Today</span>
        </a>
        <a class="sidebar__nav-item" data-route="syllabus" href="#syllabus">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span>Syllabus</span>
        </a>
        <a class="sidebar__nav-item" data-route="subjects" href="#subjects">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Subject Progress</span>
        </a>
        <a class="sidebar__nav-item" data-route="pastPapers" href="#pastPapers">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Past Papers</span>
        </a>
        <a class="sidebar__nav-item" data-route="essays" href="#essays">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="14 2 18 6 7 17 3 17 3 13 14 2"/><line x1="3" y1="22" x2="21" y2="22"/></svg>
          <span>Essays</span>
        </a>
        <a class="sidebar__nav-item" data-route="backlog" href="#backlog">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          <span>Backlog</span>
        </a>

        <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 8px 16px;"></div>

        <a class="sidebar__nav-item" data-route="weekly" href="#weekly">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>Weekly Review</span>
        </a>
        <a class="sidebar__nav-item" data-route="monthly" href="#monthly">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
          <span>Monthly Review</span>
        </a>
        <a class="sidebar__nav-item" data-route="roadmap" href="#roadmap">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          <span>Roadmap</span>
        </a>

        <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 8px 16px;"></div>

        <a class="sidebar__nav-item" data-route="settings" href="#settings">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </a>
      </div>

      <!-- Sidebar Footer: Overall Progress -->
      <div class="sidebar__footer" id="sidebar-footer">
        <div style="font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600;">Overall Progress</div>
        <div style="margin-bottom: 6px;">
          <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 4px;">
            <span style="color: var(--text-secondary);">Coverage</span>
            <span style="color: var(--accent-primary); font-weight: 600;" id="sidebar-coverage">0%</span>
          </div>
          <div class="progress progress--sm">
            <div class="progress__fill" id="sidebar-coverage-bar" style="width: 0%;"></div>
          </div>
        </div>
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 4px;">
            <span style="color: var(--text-secondary);">Mastery</span>
            <span style="color: var(--accent-secondary); font-weight: 600;" id="sidebar-mastery">0%</span>
          </div>
          <div class="progress progress--sm">
            <div class="progress__fill" id="sidebar-mastery-bar" style="width: 0%; background: var(--accent-secondary);"></div>
          </div>
        </div>
        <div style="margin-top: 10px; font-size: 0.6875rem; color: var(--text-muted); text-align: center;" id="sidebar-days-remaining">
          <!-- Days remaining -->
        </div>
      </div>
    </nav>

    <!-- Mobile Header (hidden on desktop) -->
    <header class="mobile-header" id="mobile-header">
      <button class="btn btn--ghost btn--icon" id="mobile-menu-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="mobile-header__title">⚡ CSS Command Center</span>
    </header>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content">
      <!-- Pages render here -->
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modal-container" style="display: none;"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Mobile Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
